<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>危険店舗</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
  padding:20px;
  background:#f5f6fa;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
}

.title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:20px;
}

.task{
  margin-left:10px;
}

.bad{
  color:red;
  font-weight:bold;
}

.warn{
  color:orange;
  font-weight:bold;
}

.good{
  color:green;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="title">危険店舗ランキング</div>

{% for r in rows %}

<div class="card"
style="border-left: 6px solid {% if r.risk >= 20 %}red{% elif r.risk >= 10 %}orange{% else %}green{% endif %};">

  <!-- 店舗名 -->
  <h2>{{ r.name }}</h2>

  <!-- 🔥 やること（最優先） -->
  <p><strong>やること</strong></p>

  <ul class="task">
  {% for t in r.tasks %}
    <li>{{ t }}</li>
  {% endfor %}
  </ul>

  <!-- 状態 -->
  <p>
    未返信口コミ: {{ r.unreplied }}件<br>
    低評価レビュー: {{ r.low_reviews }}件<br>
    投稿数: {{ r.posts }}件
  </p>

  <!-- リスクスコア -->
  <p class="
  {% if r.risk >= 20 %}bad
  {% elif r.risk >= 10 %}warn
  {% else %}good
  {% endif %}
  ">
  リスクスコア: {{ r.risk }}
  </p>

  <!-- 導線 -->
  <a href="/store/{{ r.id }}/page">→ 店舗詳細</a><br><br>
  <a href="/store/{{ r.id }}/reviews">→ 口コミ対応する</a>

</div>

{% endfor %}

</body>
</html>
