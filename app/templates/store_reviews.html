<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>口コミ一覧</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:20px;
  background:#f6f7f9;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.bad{
  color:red;
  font-weight:bold;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#111;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>口コミ一覧（{{ store.name }}）</h1>

<p>件数: {{ pending_reviews|length }}</p>

{% for r in pending_reviews %}
  <div class="card">

    <p><b>評価：</b> {{ r.rating }}</p>
    <p>{{ r.comment }}</p>

    {% if r.risk >= 60 %}
      <p class="bad">⚠ 危険口コミ</p>
    {% endif %}

    <form action="/reviews/{{ r.id }}/send_reply" method="post">
      <button type="submit">返信する</button>
    </form>

  </div>
{% endfor %}

{% if not pending_reviews %}
  <p>未返信の口コミはありません</p>
{% endif %}

</body>
</html>
