<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>投稿管理</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    select {
      padding: 8px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .status {
      font-weight: bold;
    }

    .approved { color: green; }
    .failed { color: red; }
    .draft { color: gray; }
    .queued { color: orange; }

    .buttons {
      margin-top: 10px;
    }

    button {
      padding: 8px 12px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .approve {
      background: #4CAF50;
      color: white;
    }

    .reject {
      background: #f44336;
      color: white;
    }

    .copy {
      background: #2196F3;
      color: white;
    }
  </style>
</head>

<body>

<h1>投稿管理</h1>

<!-- フィルター -->
<select id="filter" onchange="loadPosts()">
  <option value="">全部</option>
  <option value="draft">未承認</option>
  <option value="approved">承認済み</option>
  <option value="failed">失敗</option>
</select>

<div id="posts"></div>

<script>
async function loadPosts() {
  const status = document.getElementById("filter").value;

  let url = "/admin/posts";
  if (status) {
    url += "?status=" + status;
  }

  const res = await fetch(url);
  const data = await res.json();

  const container = document.getElementById("posts");
  container.innerHTML = "";

  data.forEach(p => {

    let statusClass = p.status;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <p><b>ID:</b> ${p.id}</p>

      <p class="status ${statusClass}">
        STATUS: ${p.status}
      </p>

      <p><b>タイトル:</b> ${p.title || ""}</p>

      <p><b>内容:</b><br>${p.content}</p>

      <div class="buttons">
        <button class="approve" onclick="approve(${p.id})">承認</button>
        <button class="reject" onclick="reject(${p.id})">却下</button>
        <button class="copy" onclick="copyText(${JSON.stringify(p.content)})">コピー</button>
      </div>
    `;

    container.appendChild(div);
  });
}

async function approve(id) {
  await fetch(`/admin/posts/${id}/approve`, {
    method: "POST"
  });
  loadPosts();
}

async function reject(id) {
  await fetch(`/admin/posts/${id}/reject`, {
    method: "POST"
  });
  loadPosts();
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert("コピーしたで");
}

loadPosts();
</script>

</body>
</html>
