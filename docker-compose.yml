services:

  api:
    build: .
    container_name: gbp_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gbp

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - db
      - redis


  db:
    image: postgres:16
    container_name: gbp_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gbp

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: gbp_redis
    restart: always

    ports:
      - "6379:6379"


  worker:
    build: .
    container_name: gbp_worker
    command: rq worker -u redis://redis:6379 gbp

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gbp

    depends_on:
      - redis
      - db


  scheduler:
    build: .
    container_name: gbp_scheduler
    command: python -u -m app.main_scheduler

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/gbp

    depends_on:
      - redis
      - db


volumes:
  db_data: